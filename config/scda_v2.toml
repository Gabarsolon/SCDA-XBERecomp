# Recompiler input for default.xbe (Splinter Cell: Double Agent, original Xbox, title 5553005E)
includes = ["xdk_symbols.toml"]

[xbe]
path = "assets/default.xbe"
out = "generated/game"
library = "SCDA.dll"  # <exe>.dll, which the executable delay loads
partitions = 128
code_sections = [".text", "XNET", "XONLINE", "D3D", "D3DX", "XGRPH", "DSOUND", "XPP",
    "BINK", "BINK32", "BINK32A", "BINK16", "BINK4444", "BINK5551", "BINKYUY2",
    "BINK16MX", "BINK16X2", "BINK16M", "BINK32MX", "BINK32X2", "BINK32M"]

